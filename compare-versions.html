  <script src="shared.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let tenderKey = urlParams.get('tender') || 'GJ-2026-105';
    let verA = urlParams.get('from') || 'v1.0';
    let verB = urlParams.get('to') || 'v1.2';

    const fieldDisplayNames = {
      submissionDeadline: "Submission Deadline",
      technicalBidOpening: "Technical Bid Opening",
      financialBidOpening: "Financial Bid Opening",
      eligibilityTurnover: "Eligibility Annual Turnover",
      emdAmount: "EMD Amount",
      completionPeriod: "Completion Period",
      preBidMeeting: "Pre-Bid Meeting Date & Mode",
      technicalSpecs: "Technical Specification Standards",
      warrantyPeriod: "Warranty Period",
      certificationRequired: "Required Certification",
      deliveryPeriod: "Delivery Schedule"
    };

    function populateSelectors() {
      const tender = getTenderVersionData(tenderKey);
      document.getElementById('bread-tender-id').innerText = tender.tenderId;

      const selA = document.getElementById('select-ver-a');
      const selB = document.getElementById('select-ver-b');

      selA.innerHTML = tender.versions.map(v => `
        <option value="${v.version}" ${v.version === verA ? 'selected' : ''}>
          ${v.version} - ${v.type} (${v.publishDate})
        </option>
      `).join('');

      selB.innerHTML = tender.versions.map(v => `
        <option value="${v.version}" ${v.version === verB ? 'selected' : ''}>
          ${v.version} - ${v.type} (${v.publishDate})
        </option>
      `).join('');
    }

    function swapVersions() {
      const temp = verA;
      verA = verB;
      verB = temp;
      populateSelectors();
      triggerComparison();
    }

    function triggerComparison() {
      verA = document.getElementById('select-ver-a').value;
      verB = document.getElementById('select-ver-b').value;
      renderDiff();
    }

    function renderDiff() {
      const tender = getTenderVersionData(tenderKey);
      const objA = tender.versions.find(v => v.version === verA) || tender.versions[0];
      const objB = tender.versions.find(v => v.version === verB) || tender.versions[tender.versions.length - 1];

      document.getElementById('th-ver-a').innerText = `${objA.type} (${objA.version} - ${objA.publishDate})`;
      document.getElementById('th-ver-b').innerText = `${objB.type} (${objB.version} - ${objB.publishDate})`;
      document.getElementById('doc-title-a').innerText = `${objA.type} (${objA.version}) Clauses`;
      document.getElementById('doc-title-b').innerText = `${objB.type} (${objB.version}) Clauses`;

      const valsA = objA.values || {};
      const valsB = objB.values || {};

      const allKeys = Array.from(new Set([...Object.keys(valsA), ...Object.keys(valsB)]));
      let modified = 0;
      let unchanged = 0;

      const tbody = document.getElementById('matrix-tbody');
      tbody.innerHTML = allKeys.map(k => {
        const valA = valsA[k] || 'Not specified in this release';
        const valB = valsB[k] || 'Not specified in this release';
        const isDiff = valA !== valB;

        if (isDiff) modified++;
        else unchanged++;

        return `
          <tr class="${isDiff ? 'bg-amber-50/30' : 'hover:bg-slate-50/50'} transition-colors">
            <td class="py-3.5 px-4 font-bold text-slate-800">
              ${fieldDisplayNames[k] || k}
            </td>
            <td class="py-3.5 px-4 font-mono ${isDiff ? 'text-rose-600 line-through bg-rose-50/40' : 'text-slate-600'}">
              ${valA}
            </td>
            <td class="py-3.5 px-4 font-mono font-bold ${isDiff ? 'text-emerald-800 bg-emerald-50/60' : 'text-slate-800'}">
              ${valB}
            </td>
            <td class="py-3.5 px-4 text-center">
              ${isDiff 
                ? '<span class="px-2 py-0.5 rounded text-[10px] font-extrabold bg-amber-100 text-amber-800">MODIFIED</span>'
                : '<span class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-100 text-slate-500">MATCH</span>'
              }
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById('diff-modified-count').innerText = `${modified} Field(s)`;
      document.getElementById('diff-unchanged-count').innerText = `${unchanged} Field(s)`;
      document.getElementById('diff-lag-subtitle').innerText = `${objA.publishDate} to ${objB.publishDate}`;

      // Update Clause view
      document.getElementById('doc-clause-a').innerText = `Submission Deadline: ${valsA.submissionDeadline || 'N/A'}`;
      document.getElementById('doc-clause-b').innerText = `Submission Deadline: ${valsB.submissionDeadline || 'N/A'}`;
      document.getElementById('doc-turnover-a').innerText = `Turnover Criterion: ${valsA.eligibilityTurnover || 'N/A'}`;
      document.getElementById('doc-turnover-b').innerText = `Turnover Criterion: ${valsB.eligibilityTurnover || 'N/A'}`;

      lucide.createIcons();
    }

    function setViewMode(mode) {
      if (mode === 'matrix') {
        document.getElementById('view-matrix').classList.remove('hidden');
        document.getElementById('view-document').classList.add('hidden');
        document.getElementById('tab-matrix-btn').className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-blue-600 shadow-xs border border-slate-200";
        document.getElementById('tab-doc-btn').className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900";
      } else {
        document.getElementById('view-matrix').classList.add('hidden');
        document.getElementById('view-document').classList.remove('hidden');
        document.getElementById('tab-doc-btn').className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-blue-600 shadow-xs border border-slate-200";
        document.getElementById('tab-matrix-btn').className = "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900";
      }
    }

    // Initialize
    lucide.createIcons();
    initSharedNav('versions');
    populateSelectors();
    renderDiff();
  </script>
